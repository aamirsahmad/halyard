name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# a newer push to the same branch or pull request cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: script/install-linux-deps.sh
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt, clippy
      - run: script/fetch-webrtc.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: script/install-linux-deps.sh
      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Download prebuilt WebRTC (voice calls)
        run: script/fetch-webrtc.sh
      - name: Unit, integration and UI tests
        run: cargo test --workspace --locked
      # a real RingRTC call between two engines; Linux runners need no audio devices
      - name: Voice call test
        if: runner.os == 'Linux'
        run: cargo test -p signal-backend --test call_loopback --locked -- --ignored --test-threads=1 --nocapture
        env:
          CALL_TEST_LOG: "1"
      - name: Offscreen rendering tests
        run: cargo test -p signal-app --test rendering --locked
        env:
          SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-${{ matrix.os }}
          path: screenshots
          if-no-files-found: ignore
      - name: Release build
        run: cargo build --release --locked -p signal-app
