[package]
name = "signal-core"
description = "Domain model, persistence and view-model logic for the Halyard client"
version.workspace = true
edition.workspace = true
license.workspace = true
# Not on crates.io: it needs git-only dependencies (libsignal, presage, RingRTC).
publish = false

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true
rusqlite.workspace = true
hex.workspace = true
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.9"

[dev-dependencies]
tempfile.workspace = true

# Release builds for Linux carry their own OpenSSL (for SQLCipher), so the
# binary runs regardless of the distribution's OpenSSL. macOS uses CommonCrypto.
[target.'cfg(target_os = "linux")'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }
