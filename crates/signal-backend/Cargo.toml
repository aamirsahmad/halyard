[package]
name = "signal-backend"
description = "libsignal/presage powered Signal service backend running on a dedicated thread"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
signal-core.workspace = true
presage.workspace = true
presage-store-sqlite.workspace = true
anyhow.workspace = true
thiserror.workspace = true
chrono.workspace = true
tracing.workspace = true
tokio.workspace = true
futures.workspace = true
uuid.workspace = true
hex.workspace = true
mime_guess = "2"
url = "2"
serde.workspace = true
serde_json.workspace = true
rand = "0.9"
# same version libsignal-service uses (it does not re-export it)
reqwest = { version = "0.13", default-features = false }
# 1:1 voice calls. Needs the prebuilt WebRTC from script/fetch-webrtc.sh.
ringrtc = { git = "https://github.com/signalapp/ringrtc", tag = "v2.75.0", features = ["native"] }

# On Linux, use cubeb's C audio backends (PulseAudio, ALSA). Its Rust PulseAudio
# backend is a static library with its own copy of Rust's core library, which
# GNU ld rejects as duplicate symbols. ("unittest-build" only turns off the Rust
# backends.)
[target.'cfg(target_os = "linux")'.dependencies]
cubeb-sys = { version = "0.38", features = ["unittest-build"] }

[dev-dependencies]
tempfile.workspace = true
